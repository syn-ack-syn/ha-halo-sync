# Development only: runs the test suite with `uv run pytest`. Home Assistant installs the
# integration from custom_components/halo_sync, so nothing here is built or published.
[project]
name = "ha-halo-sync"
version = "0.6.0"
description = "Development environment for the Halo Sync Home Assistant integration"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "cryptography>=43",
    "requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
